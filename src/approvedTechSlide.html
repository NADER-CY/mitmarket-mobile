  <!-- MITMARKET Slide: Tech & AI Edition (Matches compact ~390px x 250px form factor) -->
  <div class="relative w-full max-w-[400px] h-[250px] rounded-[18px] overflow-hidden border border-white/10 shadow-2xl flex flex-col justify-between select-none bg-[#101216]">
    
    <!-- Background Image: Photographic AI Processor -->
    <div class="absolute inset-0 z-0">
      <img 
        src="/tech-background-v1.jpg" 
        alt="AI Processor Background" 
        class="w-full h-full object-cover object-center opacity-45 scale-105"
      />
      <!-- Tech dark gradient overlays: Ensures contrast for text while letting glowing circuitry show -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#101216] via-[#101216]/85 to-[#101216]/50"></div>
      <div class="absolute inset-0 bg-gradient-to-r from-[#101216]/90 via-[#101216]/40 to-transparent"></div>
      <!-- Subtle top-down tech ambient glow -->
      <div class="absolute -top-12 -left-12 w-44 h-44 bg-[#1463ff]/20 rounded-full blur-3xl pointer-events-none"></div>
    </div>

    <!-- Top Section: Badges & Live Status -->
    <div class="relative z-10 pt-4 px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <!-- Category Badge: TECH & AI -->
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold tracking-wide uppercase bg-[#1463ff]/20 text-[#60a5fa] border border-[#1463ff]/35 backdrop-blur-md">
          <span class="w-1.5 h-1.5 rounded-full bg-[#1463ff] animate-pulse"></span>
          TECH &amp; AI
        </span>
        <span class="text-[11px] font-medium text-slate-400" data-field="event-label">BENCHMARKS</span>
      </div>

      <!-- Live momentum / volatility indicator -->
      <div class="flex items-center gap-1 text-[11px] font-semibold text-[#0bba74] bg-[#0bba74]/10 border border-[#0bba74]/20 px-2 py-0.5 rounded-md">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
        </svg>
        <span data-field="yes-change">+8.4%</span>
        <span class="text-[10px] text-slate-400 font-normal">24h</span>
      </div>
    </div>

    <!-- Middle Section: Headline -->
    <div class="relative z-10 px-4 pt-1">
      <h2 data-field="title" class="text-[16px] sm:text-[17px] font-bold text-white tracking-tight leading-[1.3] line-clamp-2 max-w-[340px] drop-shadow-sm">
        Will a new AI model lead the benchmark rankings?
      </h2>
    </div>

    <!-- Lower Section: Seamless Chart with Floating Endpoint Metric & Integrated Footer -->
    <div class="relative z-10 w-full flex flex-col justify-end mt-auto">
      
      <!-- Expressive Probability History Chart (Directly integrated, no boxed panel) -->
      <div class="relative w-full h-[88px] overflow-visible">
        
        <svg class="w-full h-full overflow-visible" viewBox="0 0 390 88" fill="none" preserveAspectRatio="none">
          <defs>
            <!-- Cyan-to-green probability gradient fill -->
            <linearGradient id="techAreaGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0bba74" stop-opacity="0.32" />
              <stop offset="65%" stop-color="#1463ff" stop-opacity="0.10" />
              <stop offset="100%" stop-color="#101216" stop-opacity="0.0" />
            </linearGradient>

            <linearGradient id="techLineGradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#1463ff" />
              <stop offset="45%" stop-color="#38bdf8" />
              <stop offset="85%" stop-color="#0bba74" />
              <stop offset="100%" stop-color="#0bba74" />
            </linearGradient>

            <!-- Glow filter for line and pulse dot -->
            <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Subtle horizontal reference grid guide -->
          <line x1="16" y1="38" x2="310" y2="38" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 4" stroke-width="1" />
          <line x1="16" y1="62" x2="350" y2="62" stroke="rgba(255,255,255,0.04)" stroke-dasharray="3 4" stroke-width="1" />

          <!-- Filled Area Under Curve -->
          <path data-field="chart-area" 
            d="M 16,66 
               C 50,68 65,48 95,54 
               C 125,60 140,74 175,64 
               C 210,54 225,28 255,34 
               C 280,39 295,49 320,38 
               C 335,32 342,28 350,26 
               L 350,88 
               L 16,88 Z" 
            fill="url(#techAreaGradient)" 
          />

          <!-- Expressive Probability Line Chart with multiple rises and pullbacks -->
          <path data-field="chart-line" 
            d="M 16,66 
               C 50,68 65,48 95,54 
               C 125,60 140,74 175,64 
               C 210,54 225,28 255,34 
               C 280,39 295,49 320,38 
               C 335,32 342,28 350,26" 
            stroke="url(#techLineGradient)" 
            stroke-width="2.75" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#neonGlow)"
          />

          <!-- Endpoint Pulse Halo -->
          <circle data-field="chart-halo" cx="350" cy="26" r="7" fill="#0bba74" fill-opacity="0.25">
            <animate attributeName="r" values="4;9;4" dur="2.2s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.35;0.08;0.35" dur="2.2s" repeatCount="indefinite" />
          </circle>

          <!-- Endpoint Solid Dot -->
          <circle data-field="chart-dot" cx="350" cy="26" r="3.5" fill="#ffffff" stroke="#0bba74" stroke-width="2" />
        </svg>

        <!-- Floating Current Probability Endpoint Label -->
        <div class="absolute right-3.5 top-[5px] flex items-center gap-1.5 bg-[#101216]/95 border border-[#0bba74]/50 shadow-lg shadow-[#0bba74]/15 px-2.5 py-1 rounded-lg backdrop-blur-md">
          <span class="text-[13px] font-extrabold text-[#0bba74] tracking-tight" data-field="yes">57%</span>
          <span class="text-[10px] font-bold text-white uppercase tracking-wider bg-[#0bba74]/20 text-[#0bba74] px-1.5 py-0.2 rounded">YES</span>
        </div>

        <!-- 30D Trend context indicator on the left side of the chart -->
        <div class="absolute left-4 bottom-[26px] text-[10px] font-medium text-slate-400/80 flex items-center gap-1">
          <span data-field="history-label">30D History</span>
        </div>
      </div>

      <!-- Minimal Footer Metadata Row (Aligned flush to bottom edge, 12px bottom padding) -->
      <div class="px-4 pb-3 pt-0 flex items-center justify-between text-[11px] text-slate-400 border-t border-white/5 bg-[#101216]/40 backdrop-blur-sm">
        <div class="flex items-center gap-1.5">
          <span class="text-slate-400 font-medium">Vol:</span>
          <span class="font-semibold text-slate-200 tracking-tight" data-field="volume">$4.65M</span>
        </div>

        <div class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke-width="2"></circle>
            <path stroke-width="2" d="M12 7v5l3 2" stroke-linecap="round"></path>
          </svg>
          <span class="text-slate-400">Closes</span>
          <span class="font-medium text-slate-200" data-field="end">Dec 31, 2025</span>
        </div>
      </div>

    </div>

  </div>
