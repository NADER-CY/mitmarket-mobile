  <!-- MITMARKET Compact Mobile Carousel Slide (390px responsive, ~250px height) -->
  <div class="relative w-full max-w-[390px] h-[252px] rounded-2xl overflow-hidden shadow-2xl border border-white/10 flex flex-col justify-between p-4 box-border select-none group">
    
    <!-- Full-bleed Cinematic Background Image -->
    <img 
      src="/politics-background-v1.jpg" 
      alt="Parliament Chamber" 
      class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none transform transition-transform duration-700 group-hover:scale-105"
    />

    <!-- Multi-layered Editorial Dark Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-[#101216] via-[#101216]/75 to-[#101216]/50 pointer-events-none"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-[#101216]/90 via-[#101216]/50 to-[#101216]/80 pointer-events-none"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-blue-900/25 via-transparent to-black/60 pointer-events-none"></div>

    <!-- Top Bar: Small POLITICS Badge and Editorial Live Indicator -->
    <div class="relative z-10 flex items-center justify-between">
      <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#1463ff]/20 border border-[#1463ff]/40 backdrop-blur-md">
        <span class="w-1.5 h-1.5 rounded-full bg-[#1463ff] animate-pulse"></span>
        <span class="text-[10px] font-bold tracking-wider text-blue-300 uppercase">POLITICS</span>
      </div>

      <div class="flex items-center gap-1.5 text-gray-400 text-[11px] font-medium backdrop-blur-sm bg-black/30 px-2 py-0.5 rounded-md border border-white/5">
        <svg class="w-3 h-3 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
        <span class="text-emerald-400 font-semibold text-[10px]" data-field="yes-change">+5.2%</span>
        <span class="text-[10px] text-gray-400" data-field="history-label">7D</span>
      </div>
    </div>

    <!-- Middle Hero Section: Editorial Headline (Left) & Circular Radial Probability Hub (Right) -->
    <div class="relative z-10 grid grid-cols-[1fr_86px] gap-3 items-center mt-0.5">
      <!-- Left: Bold Prediction Headline -->
      <div class="flex flex-col">
        <span class="text-[10px] font-medium text-blue-200/70 tracking-wide uppercase mb-1" data-field="event-label">General Election 2025</span>
        <h1 data-field="title" style="display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden" class="text-[16px] leading-[1.3] font-bold text-white tracking-tight drop-shadow-md">
          Will the governing coalition retain its majority?
        </h1>
      </div>

      <!-- Right: Large Circular Probability Indicator -->
      <div class="relative w-[86px] h-[86px] flex items-center justify-center shrink-0">
        <!-- Circular Progress Ring SVG -->
        <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 86 86">
          <!-- Background track -->
          <circle 
            cx="43" 
            cy="43" 
            r="35" 
            stroke="rgba(255, 255, 255, 0.1)" 
            stroke-width="5" 
            fill="rgba(16, 18, 22, 0.65)"
            stroke-linecap="round"
          />
          <!-- Highlighted YES probability arc: 64% of 220 (circumference: 2 * pi * 35 = ~219.9) => 140.7 -->
          <circle 
            cx="43" 
            cy="43" 
            r="35" 
            stroke="#0bba74" 
            stroke-width="5.5" 
            data-field="probability-ring" stroke-dasharray="220" 
            stroke-dashoffset="79.2" 
            stroke-linecap="round" 
            fill="transparent"
            class="filter drop-shadow-[0_0_6px_rgba(11,186,116,0.5)]"
          />
        </svg>

        <!-- Center Typography: 64% YES -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
          <span class="text-[20px] font-black text-white leading-none tracking-tight" data-field="yes">64%</span>
          <span class="text-[10px] font-bold text-[#0bba74] tracking-wider uppercase mt-0.5">YES</span>
        </div>
      </div>
    </div>

    <!-- Integrated Ambient Sparkline (Seamlessly cut into photo without boxed panel) -->
    <div class="relative z-10 w-full h-[32px] flex flex-col justify-end -mb-1">
      <div class="w-full h-[26px] relative overflow-hidden">
        <svg class="w-full h-full" viewBox="0 0 358 26" fill="none" preserveAspectRatio="none">
          <defs>
            <linearGradient id="politicsGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0bba74" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#0bba74" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <!-- Subtle translucent area fill -->
          <path data-field="chart-area" 
            d="M0 20 C45 22, 80 14, 130 16 C180 18, 220 7, 270 9 C310 10, 335 4, 358 3 L358 26 L0 26 Z" 
            fill="url(#politicsGradient)"
          />
          <!-- Glowing history trajectory line -->
          <path data-field="chart-line" 
            d="M0 20 C45 22, 80 14, 130 16 C180 18, 220 7, 270 9 C310 10, 335 4, 358 3" 
            stroke="#0bba74" 
            stroke-width="2" 
            stroke-linecap="round"
          />
          <!-- Endpoint pulse dot -->
          <circle data-field="chart-dot" cx="358" cy="3" r="2.5" fill="#0bba74" />
        </svg>
      </div>
    </div>

    <!-- Minimal Editorial Footer: Volume and Closing Date (No trading buttons, flush against 12px bottom boundary) -->
    <div class="relative z-10 flex items-center justify-between pt-1 border-t border-white/10 text-[11px] font-medium text-gray-300">
      <!-- Volume Indicator -->
      <div class="flex items-center gap-1.5">
        <span class="text-gray-400 text-[10px] uppercase tracking-wider font-semibold">Vol</span>
        <span class="text-white font-bold text-[11px]" data-field="volume">$3.18M</span>
      </div>

      <!-- Closing Time -->
      <div class="flex items-center gap-1.5 text-gray-300">
        <svg class="w-3.5 h-3.5 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="text-[10px] text-gray-400">Closes</span>
        <span class="text-white font-medium text-[11px]" data-field="end">Nov 4, 2025</span>
      </div>
    </div>

  </div>
