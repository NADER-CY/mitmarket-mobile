    .slide-card {
      width: 390px;
      min-height: 350px;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background-color: #101216;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .bg-image-layer {
      position: absolute;
      inset: 0;
      background-image: url('/ethereum-slide-background.jpg');
      background-size: cover;
      background-position: center 38%;
      transform: scale(1.04);
      filter: saturate(1.15) brightness(0.95);
    }
    /* Balanced multi-stop dark gradient overlay allowing the Ethereum artwork to shine through */
    .overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg, 
        rgba(16, 18, 22, 0.72) 0%, 
        rgba(16, 18, 22, 0.40) 24%, 
        rgba(16, 18, 22, 0.78) 60%, 
        rgba(16, 18, 22, 0.96) 88%,
        #101216 100%
      );
    }
    .glow-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 75% 25%, rgba(20, 99, 255, 0.18), transparent 55%);
      mix-blend-mode: screen;
    }
    .glass-pill {
      background: rgba(16, 18, 22, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  .slide-card{width:100%;font-family:Inter,sans-serif}:host{display:block;width:100%}</style>

  <!-- SINGLE CAROUSEL SLIDE CONTAINER (390px width) -->
  <div class="slide-card flex flex-col justify-between p-4 relative text-white select-none">
    
    <!-- Background Ethereum Image & Overlays -->
    <div class="bg-image-layer"></div>
    <div class="glow-tint"></div>
    <div class="overlay-gradient"></div>

    <!-- Content Wrapper -->
    <div class="relative z-10 flex flex-col h-full justify-between gap-3">
      
      <!-- Top Row: Badges & Live Status -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-1.5">
            <!-- CRYPTO Badge -->
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-[#1463ff]/20 text-[#1463ff] border border-[#1463ff]/40 shadow-[0_0_10px_rgba(20,99,255,0.25)]">
              <svg class="w-2.5 h-2.5 mr-1" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1.5L4.5 12l7.5 4.5 7.5-4.5L12 1.5zm0 15.75L4.5 13.5 12 22.5l7.5-9-7.5 3.75z"/>
              </svg>
              Crypto
            </span>
            <!-- FEATURED Badge -->
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase glass-pill text-amber-300 border-amber-400/30">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400 mr-1 animate-pulse"></span>
              Featured
            </span>
          </div>

          <!-- Market Volume Pill -->
          <div class="glass-pill px-2.5 py-0.5 rounded-full flex items-center gap-1.5 text-[11px] text-gray-300">
            <span class="text-gray-400">Vol:</span>
            <span class="font-semibold text-white font-mono" data-field="volume">$1.42M</span>
          </div>
        </div>

        <!-- Prediction Question -->
        <h2 data-field="title" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:47px" class="text-[17px] font-bold leading-snug tracking-tight text-white drop-shadow-md pr-1">
          Will Ethereum outperform Bitcoin this month?
        </h2>
      </div>

      <!-- Probability Stats & Mini Trend Chart Section -->
      <div class="glass-pill rounded-xl p-2.5 border border-white/10 shadow-lg">
        <div class="flex items-center justify-between mb-1.5">
          <!-- YES side -->
          <div class="flex items-baseline gap-1.5">
            <span class="text-xs font-bold text-gray-300">YES</span>
            <span class="text-2xl font-extrabold text-[#0bba74] tracking-tight leading-none drop-shadow-[0_2px_8px_rgba(11,186,116,0.35)]" data-field="yes">68%</span>
            <span class="text-[10px] text-[#0bba74] font-medium flex items-center" data-field="yes-change">
              ▲ 4.2%
            </span>
          </div>

          <!-- Integrated Inline Probability Trend Line Chart -->
          <div class="flex flex-col items-center px-1">
            <div class="text-[9px] text-gray-400 mb-0.5 font-medium tracking-wide" data-field="history-label">30D PROBABILITY</div>
            <svg class="w-24 h-6 overflow-visible" viewBox="0 0 96 24" fill="none">
              <defs>
                <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0bba74" stop-opacity="0.45"/>
                  <stop offset="100%" stop-color="#0bba74" stop-opacity="0.0"/>
                </linearGradient>
              </defs>
              <!-- Filled area under probability line -->
              <path data-field="chart-area" d="M 0 18 Q 16 19 28 14 T 54 11 T 76 6 T 96 4 L 96 24 L 0 24 Z" fill="url(#chartGradient)" />
              <!-- Chart Line -->
              <path data-field="chart-line" d="M 0 18 Q 16 19 28 14 T 54 11 T 76 6 T 96 4" stroke="#0bba74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Current endpoint indicator dot -->
              <circle data-field="chart-dot" cx="96" cy="4" r="2.5" fill="#0bba74" stroke="#101216" stroke-width="1.5" />
            </svg>
          </div>

          <!-- NO side -->
          <div class="flex items-baseline gap-1.5 text-right">
            <span class="text-[10px] text-[#ff4761] font-medium flex items-center" data-field="no-change">
              ▼ 4.2%
            </span>
            <span class="text-2xl font-extrabold text-[#ff4761] tracking-tight leading-none drop-shadow-[0_2px_8px_rgba(255,71,97,0.35)]" data-field="no">32%</span>
            <span class="text-xs font-bold text-gray-300">NO</span>
          </div>
        </div>

        <!-- Dual Probability Segmented Bar -->
        <div class="w-full h-1.5 rounded-full overflow-hidden bg-white/10 flex">
          <div class="h-full bg-[#0bba74] shadow-[0_0_8px_rgba(11,186,116,0.6)]" data-field="yes-bar" style="width: 68%;"></div>
          <div class="h-full bg-[#ff4761] shadow-[0_0_8px_rgba(255,71,97,0.6)]" data-field="no-bar" style="width: 32%;"></div>
        </div>
      </div>

      <!-- Action Buttons: Buy YES / Buy NO -->
      <div class="grid grid-cols-2 gap-2.5">
        <!-- BUY YES BUTTON -->
        <button class="group relative overflow-hidden flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-[#0bba74] text-white font-semibold shadow-[0_4px_16px_rgba(11,186,116,0.3)] hover:brightness-110 active:scale-[0.98] transition-all duration-150">
          <div class="flex flex-col text-left">
            <span class="text-[10px] font-bold text-white/80 uppercase tracking-wider leading-none">Buy</span>
            <span class="text-sm font-bold tracking-tight">YES</span>
          </div>
          <div class="glass-pill bg-black/25 px-2 py-1 rounded-lg text-xs font-bold font-mono border-white/20" data-field="yes-price">
            68¢
          </div>
        </button>

        <!-- BUY NO BUTTON -->
        <button class="group relative overflow-hidden flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-[#ff4761] text-white font-semibold shadow-[0_4px_16px_rgba(255,71,97,0.3)] hover:brightness-110 active:scale-[0.98] transition-all duration-150">
          <div class="flex flex-col text-left">
            <span class="text-[10px] font-bold text-white/80 uppercase tracking-wider leading-none">Buy</span>
            <span class="text-sm font-bold tracking-tight">NO</span>
          </div>
          <div class="glass-pill bg-black/25 px-2 py-1 rounded-lg text-xs font-bold font-mono border-white/20" data-field="no-price">
            32¢
          </div>
        </button>
      </div>

      <!-- Footer Metadata: Closing Time, Liquidity & Volume -->
      <div class="pt-1 flex items-center justify-between text-[11px] text-gray-400 border-t border-white/10 px-0.5">
        <!-- Closing Time -->
        <div class="flex items-center gap-1">
          <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke-width="2"/>
            <polyline points="12 6 12 12 16 14" stroke-width="2"/>
          </svg>
          <span>Closes <strong class="text-gray-200 font-medium" data-field="end">May 31, 23:59 UTC</strong></span>
        </div>

        <!-- Liquidity Pool -->
