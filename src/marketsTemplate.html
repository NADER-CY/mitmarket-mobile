    :root {
      --bg-dark: #101216;
      --bg-card: #15181f;
      --bg-card-hover: #1b2029;
      --brand-blue: #1463ff;
      --market-green: #0bba74;
      --market-red: #ff4761;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(20, 99, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0b0c0e;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* Hide scrollbars while retaining touch/mouse scrollability */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Terminal container */
    .mobile-screen {
      width: 100%;
      max-width: 412px;
      min-width: 360px;
      min-height: 100vh;
      background: var(--bg-dark);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0,0,0,0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Live pulse dot */
    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #0bba74;
      border-radius: 9999px;
      display: inline-block;
      box-shadow: 0 0 8px #0bba74;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Sparkline svg container */
    .sparkline-svg {
      overflow: visible;
    }

    /* State toggles for interactive preview */
    .tab-active {
      background: rgba(20, 99, 255, 0.15) !important;
      color: #ffffff !important;
      border-color: rgba(20, 99, 255, 0.5) !important;
    }

    .chip-active {
      background: #1463ff !important;
      color: #ffffff !important;
      border-color: #1463ff !important;
      font-weight: 600;
    }

    /* Skeleton shimmer */
    @keyframes skeletonShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-box {
      background: linear-gradient(90deg, #181c24 25%, #232834 37%, #181c24 63%);
      background-size: 400% 100%;
      animation: skeletonShimmer 1.4s ease infinite;
    }
