  <!-- MITMARKET Carousel Slide Container: Exactly ~390px x 241px -->
  <div class="relative w-[390px] h-[241px] rounded-[18px] overflow-hidden border border-white/10 shadow-2xl flex flex-col justify-between p-[14px] bg-[#101216] select-none">
    
    <!-- Background Image with Gradients -->
    <div class="absolute inset-0 z-0 pointer-events-none">
      <img 
        src="/geopolitics-background-v1.jpg" 
        alt="Geopolitics Background" 
        class="w-full h-full object-cover object-center scale-105 opacity-35"
      />
      <!-- Dark Obsidian Gradients for text legibility and editorial mood -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#101216] via-[#101216]/85 to-[#101216]/60"></div>
      <div class="absolute inset-0 bg-radial-at-c from-transparent via-[#101216]/40 to-[#101216]/90"></div>
    </div>

    <!-- Content Layer -->
    <div class="relative z-10 flex flex-col h-full justify-between">
      
      <!-- Top Row: Badge + Status Indicator -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5 bg-[#1463ff]/15 border border-[#1463ff]/30 px-2.5 py-0.5 rounded-full backdrop-blur-md">
          <span class="w-1.5 h-1.5 rounded-full bg-[#1463ff] animate-pulse"></span>
          <span class="text-[10px] font-bold tracking-wider text-[#38bdf8] uppercase">GEOPOLITICS</span>
        </div>
        <div class="flex items-center gap-1 text-[10px] font-medium text-white/50 tracking-wide">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#0bba74]"></span>
          <span>DIPLOMATIC BRIEFING</span>
        </div>
      </div>

      <!-- Headline -->
      <h2 data-field="title" class="text-[14.5px] font-bold text-white tracking-tight leading-[1.25] text-left drop-shadow-sm mt-1">
        Will a new international peace agreement be signed?
      </h2>

      <!-- Central Visual: Stylized World Map with Diplomatic Connection & Likelihood Stat -->
      <div class="flex items-center justify-between gap-2.5 my-auto py-1">
        
        <!-- Left: Stylized World Map SVG with 2 Illuminated Diplomatic Hubs & Flight/Negotiation Arc -->
        <div class="relative flex-1 h-[68px] bg-white/[0.03] border border-white/[0.07] rounded-xl p-1.5 overflow-hidden flex items-center justify-center">
          <svg class="w-full h-full" viewBox="0 0 200 68" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Subtle World Map Continents Outline/Dots Silhouette -->
            <g opacity="0.22" fill="#94a3b8">
              <!-- North America -->
              <path d="M12 18c2-4 9-7 15-4 5 3 6 8 8 11-2 4-6 6-10 6-5-1-11-5-13-13z"/>
              <!-- South America -->
              <path d="M28 35c3 0 7 3 7 7 1 6-3 12-6 16-3 1-5-4-5-8 0-6 2-12 4-15z"/>
              <!-- Europe & UK -->
              <path d="M82 14c4-3 10-2 13 2 2 3 0 6-3 7-5 1-9-3-10-9z"/>
              <!-- Africa -->
              <path d="M85 27c5 0 11 4 12 9 1 7-3 14-7 19-3 1-5-3-5-7-1-8-2-17 0-21z"/>
              <!-- Eurasia / Middle East -->
              <path d="M102 16c8-5 24-4 32 3 5 4 4 10 2 14-4 6-12 6-18 4-8-2-12-10-16-21z"/>
              <!-- East Asia -->
              <path d="M142 20c6-3 16-1 19 5 2 5-2 9-6 12-6 1-11-3-13-17z"/>
              <!-- Australia / Pacific -->
              <path d="M152 46c5-2 11 1 12 5 1 5-4 8-8 8-4-1-6-7-4-13z"/>
            </g>

            <!-- Coordinate / Radar grid lines -->
            <line x1="0" y1="34" x2="200" y2="34" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 3"/>
            <line x1="72" y1="0" x2="72" y2="68" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 3"/>
            <line x1="128" y1="0" x2="128" y2="68" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 3"/>

            <!-- Diplomatic Route / Arc connecting Geneva/Brussels (Location A: 88, 20) and Neutral Summit Capital (Location B: 126, 28) -->
            <path d="M 88 22 Q 107 10 126 28" stroke="url(#routeGradient)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 2"/>
            
            <!-- Glowing Diplomatic Pulse Arc -->
            <path d="M 88 22 Q 107 10 126 28" stroke="#38bdf8" stroke-width="0.75" opacity="0.8"/>

            <!-- Hub A (Geneva / West) -->
            <circle cx="88" cy="22" r="5" fill="#1463ff" fill-opacity="0.3"/>
            <circle cx="88" cy="22" r="2.5" fill="#38bdf8"/>
            <circle cx="88" cy="22" r="1" fill="#ffffff"/>

            <!-- Hub B (Summit Host / East) -->
            <circle cx="126" cy="28" r="5" fill="#0bba74" fill-opacity="0.3"/>
            <circle cx="126" cy="28" r="2.5" fill="#0bba74"/>
            <circle cx="126" cy="28" r="1" fill="#ffffff"/>

            <defs>
              <linearGradient id="routeGradient" x1="88" y1="22" x2="126" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38bdf8"/>
                <stop offset="0.5" stop-color="#818cf8"/>
                <stop offset="1" stop-color="#0bba74"/>
              </linearGradient>
            </defs>
          </svg>
          
          <!-- Subtle map radar scanline / footer tag -->
          <div class="absolute bottom-1 left-2 flex items-center gap-1">
            <span class="text-[8px] font-mono text-white/40 tracking-wider">GLOBAL DIPLOMATIC OUTLOOK</span>
          </div>
        </div>

        <!-- Right: Agreement Likelihood Metric Block -->
        <div class="flex flex-col items-end justify-center min-w-[104px] pl-1">
          <span class="text-[8.5px] font-bold text-white/50 tracking-wider uppercase text-right leading-none mb-1">
            YES LIKELIHOOD
          </span>
          <div class="flex items-baseline gap-1">
            <span class="text-[28px] font-extrabold text-[#38bdf8] leading-none tracking-tight" data-field="yes">43%</span>
            <span class="text-[10px] font-bold text-[#ff4761] leading-none" data-field="yes-change">▼ 2.4%</span>
          </div>
          <span class="text-[9px] font-medium text-white/40 mt-1"><span data-field="history-label">LOADING HISTORY</span></span>
        </div>

      </div>

      <!-- Lower Section: Thin Probability-History Sparkline -->
      <div class="w-full flex flex-col gap-1 mt-0.5">
        <div class="relative w-full h-[18px]">
          <svg class="w-full h-full overflow-visible" preserveAspectRatio="none" viewBox="0 0 362 18">
            <defs>
              <linearGradient id="sparkGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
              </linearGradient>
            </defs>
            <!-- Sparkline fill area -->
            <path data-field="chart-area" d="M 0,14 L 30,12 L 65,15 L 105,9 L 145,13 L 185,7 L 225,11 L 265,6 L 310,12 L 340,9 L 362,10 L 362,18 L 0,18 Z" fill="url(#sparkGradient)"/>
            <!-- Sparkline main line -->
            <path data-field="chart-line" d="M 0,14 L 30,12 L 65,15 L 105,9 L 145,13 L 185,7 L 225,11 L 265,6 L 310,12 L 340,9 L 362,10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Current probability point terminal dot -->
            <circle data-field="chart-dot" cx="362" cy="10" r="2.5" fill="#38bdf8"/>
            <circle data-field="chart-halo" cx="362" cy="10" r="4.5" fill="#38bdf8" fill-opacity="0.3"/>
          </svg>
        </div>

        <!-- Footer Metadata: Volume & Closing Time -->
        <div class="flex items-center justify-between text-[10px] font-medium text-white/45 pt-1 border-t border-white/[0.07]">
          <div class="flex items-center gap-1">
            <span class="text-white/30 uppercase text-[9px] tracking-wider">VOL:</span>
            <span class="text-white/80 font-semibold" data-field="volume">$3.94M</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="inline-block w-1 h-1 rounded-full bg-white/30"></span>
            <span>Closes <strong class="text-white/80 font-medium" data-field="end">Jun 30, 2025</strong></span>
          </div>
        </div>
      </div>

    </div>
  </div>
