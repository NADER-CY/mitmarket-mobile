  <!-- MITMARKET Compact Mobile Carousel Slide Container -->
  <!-- Dimensions: ~390px responsive width × ~250px compact landscape height -->
  <div class="relative w-full max-w-[390px] h-[252px] rounded-[18px] overflow-hidden border border-white/[0.08] shadow-[0_20px_45px_-12px_rgba(0,0,0,0.85)] flex flex-col justify-between pt-4 px-4 pb-3 box-border select-none group bg-[#101216]">
    
    <!-- Full-bleed Cinematic Central Bank Photographic Background -->
    <div class="absolute inset-0 z-0 pointer-events-none">
      <img 
        src="/finance-background-v1.jpg" 
        alt="Central Bank Neoclassical Architecture" 
        class="w-full h-full object-cover object-center scale-100 group-hover:scale-105 transition-transform duration-700 ease-out opacity-45"
      />
      <!-- Layered Multi-Stop Dark Vignette and Gradient Overlay for Optimal Text Legibility -->
      <div class="absolute inset-0 bg-gradient-to-b from-[#101216]/85 via-[#101216]/75 to-[#101216]/95"></div>
      <div class="absolute inset-0 bg-radial from-transparent via-[#101216]/40 to-[#101216]/90"></div>
    </div>

    <!-- Inner Content Area -->
    <div class="relative z-10 flex flex-col h-full justify-between">
      
      <!-- Top Section: Header Badge & Market Sentiment Tracker -->
      <div class="flex items-center justify-between">
        <!-- FINANCE Category Badge -->
        <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[#1463ff]/15 border border-[#1463ff]/30 backdrop-blur-md">
          <span class="w-1.5 h-1.5 rounded-full bg-[#1463ff] shadow-[0_0_8px_#1463ff]"></span>
          <span class="text-[10px] font-bold tracking-wider text-[#3882ff] uppercase">Finance</span>
        </div>

        <!-- FOMC Meeting Label / Live Status -->
        <div class="inline-flex items-center gap-1.5 text-[10px] font-medium text-white/50 tracking-wide">
          <span class="w-1.5 h-1.5 rounded-full bg-[#0bba74] animate-pulse"></span>
          <span data-field="event-label">FOMC DECISION</span>
        </div>
      </div>

      <!-- Headline: Centered Prediction Question -->
      <div class="text-center px-1 my-0.5">
        <h2 data-field="title" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden" class="text-[15px] leading-tight font-semibold text-white tracking-tight text-balance">
          Will the Federal Reserve cut interest rates?
        </h2>
      </div>

      <!-- Core Editorial Module: "Two Competing Scenarios" -->
      <!-- Symmetric split layout with opposing values, colored percentages, and independent sparklines -->
      <div class="grid grid-cols-2 relative items-center py-1 px-1">
        
        <!-- Thin Subtle Vertical Divider -->
        <div class="absolute left-1/2 top-1 bottom-1 w-[1px] -translate-x-1/2 bg-gradient-to-b from-transparent via-white/15 to-transparent"></div>

        <!-- Scenario 1: RATE CUT (Left - Bullish/Green) -->
        <div class="flex flex-col items-center pr-3">
          <div class="flex items-baseline gap-1.5">
            <span class="text-[11px] font-bold tracking-wider text-white/60 uppercase" data-field="yes-label">CUT</span>
            <span class="text-[20px] font-extrabold text-[#0bba74] tracking-tight font-mono-numbers drop-shadow-[0_2px_10px_rgba(11,186,116,0.3)]" data-field="yes">62%</span>
          </div>

          <!-- Independent Seamless Sparkline (CUT Scenario: Recent Uptrend) -->
          <div class="w-full h-7 mt-1 relative flex items-center justify-center">
            <svg class="w-full h-full overflow-visible" viewBox="0 0 100 24" preserveAspectRatio="none">
              <defs>
                <linearGradient id="cutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#0bba74" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="#0bba74" stop-opacity="0.0"/>
                </linearGradient>
              </defs>
              <!-- Translucent Area Fill -->
              <path data-field="chart-area" d="M 0 18 Q 20 20 38 15 T 72 8 T 100 3 L 100 24 L 0 24 Z" fill="url(#cutGrad)" />
              <!-- Trajectory Line -->
              <path data-field="chart-line" d="M 0 18 Q 20 20 38 15 T 72 8 T 100 3" fill="none" stroke="#0bba74" stroke-width="2" stroke-linecap="round" />
              <!-- Current Value Pulse Node -->
              <circle data-field="chart-dot" cx="100" cy="3" r="2.5" fill="#0bba74" class="drop-shadow-[0_0_6px_#0bba74]" />
            </svg>
          </div>
          <span class="text-[9px] font-medium text-white/40 tracking-wider uppercase mt-0.5">24H Trajectory</span>
        </div>

        <!-- Scenario 2: RATE HOLD (Right - Unchanged/Muted Red) -->
        <div class="flex flex-col items-center pl-3">
          <div class="flex items-baseline gap-1.5">
            <span class="text-[11px] font-bold tracking-wider text-white/60 uppercase" data-field="no-label">HOLD</span>
            <span class="text-[20px] font-extrabold text-[#ff4761] tracking-tight font-mono-numbers drop-shadow-[0_2px_10px_rgba(255,71,97,0.3)]" data-field="no">38%</span>
          </div>

          <!-- Independent Seamless Sparkline (HOLD Scenario: Inverse Downtrend) -->
          <div class="w-full h-7 mt-1 relative flex items-center justify-center">
            <svg class="w-full h-full overflow-visible" viewBox="0 0 100 24" preserveAspectRatio="none">
              <defs>
                <linearGradient id="holdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ff4761" stop-opacity="0.3"/>
                  <stop offset="100%" stop-color="#ff4761" stop-opacity="0.0"/>
                </linearGradient>
              </defs>
              <!-- Translucent Area Fill -->
              <path data-field="no-chart-area" d="M 0 6 Q 20 4 38 9 T 72 16 T 100 21 L 100 24 L 0 24 Z" fill="url(#holdGrad)" />
              <!-- Trajectory Line -->
              <path data-field="no-chart-line" d="M 0 6 Q 20 4 38 9 T 72 16 T 100 21" fill="none" stroke="#ff4761" stroke-width="2" stroke-linecap="round" />
              <!-- Current Value Pulse Node -->
              <circle data-field="no-chart-dot" cx="100" cy="21" r="2.5" fill="#ff4761" class="drop-shadow-[0_0_6px_#ff4761]" />
            </svg>
          </div>
          <span class="text-[9px] font-medium text-white/40 tracking-wider uppercase mt-0.5">24H Trajectory</span>
        </div>

      </div>

      <!-- Minimal Clean Footer: Volume & Closing Time -->
      <div class="flex items-center justify-between pt-1 border-t border-white/[0.07] text-[10px] text-white/50 tracking-wide font-medium">
        <div class="flex items-center gap-1.5">
          <span class="text-white/35 font-normal">Vol</span>
          <span class="text-white/80 font-mono-numbers font-semibold" data-field="volume">$5.42M</span>
        </div>
        <div class="flex items-center gap-1 text-white/60">
          <svg class="w-3 h-3 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke-width="2"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 7v5l3 3"></path>
          </svg>
          <span data-field="end">Dec 18, 2025</span>
        </div>
      </div>

    </div>

  </div>
