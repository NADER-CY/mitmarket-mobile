<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0d10;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* Exact Dimensions: 390px x 241px */
    .card-slide {
      position: relative;
      width: 390px;
      height: 241px;
      border-radius: 18px;
      overflow: hidden;
      background-color: #101216;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 16px 12px 16px;
    }

    /* Stadium Photographic Atmosphere Overlay */
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.28;
      filter: saturate(1.15) contrast(1.1);
      pointer-events: none;
      z-index: 0;
    }
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 18%, rgba(20, 99, 255, 0.18) 0%, rgba(16, 18, 22, 0.82) 55%, #101216 100%),
                  linear-gradient(180deg, rgba(16, 18, 22, 0.4) 0%, rgba(16, 18, 22, 0.95) 85%);
      pointer-events: none;
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .sports-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3.5px 8px;
      background: rgba(20, 99, 255, 0.22);
      border: 1px solid rgba(20, 99, 255, 0.55);
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #60a5fa;
      text-transform: uppercase;
    }
    .sports-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 6px #3b82f6;
    }
    .competition-title {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .round-tag {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.05);
      padding: 2.5px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Matchup Scoreboard Centerpiece */
    .matchup-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      background: rgba(16, 22, 34, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 6px 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .team-cell {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .team-cell.right {
      justify-content: flex-end;
      text-align: right;
    }
    .team-crest {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .crest-ars {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.28) 0%, rgba(185, 28, 28, 0.12) 100%);
      border-color: rgba(239, 68, 68, 0.45);
    }
    .crest-mci {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.28) 0%, rgba(14, 116, 144, 0.12) 100%);
      border-color: rgba(56, 189, 248, 0.45);
    }
    .team-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .team-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #e2e8f0;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .team-prob {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .prob-ars {
      color: #0bba74;
    }
    .prob-mci {
      color: #38bdf8;
    }

    .vs-divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }
    .vs-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #64748b;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .draw-prob {
      font-size: 8.5px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.02em;
    }

    /* Market Question Headline */
    .headline-wrap {
      padding: 0 2px;
    }
    .headline {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.28;
      color: #ffffff;
      letter-spacing: -0.015em;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    /* Probability Visual Distribution & Sparkline */
    .chart-section {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .probability-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .probability-segmented-bar {
      height: 5px;
      width: 100%;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      background: rgba(255, 255, 255, 0.08);
    }
    .bar-seg.ars {
      width: 54%;
      background: #0bba74;
      box-shadow: 0 0 8px rgba(11, 186, 116, 0.6);
    }
    .bar-seg.draw {
      width: 14%;
      background: #64748b;
    }
    .bar-seg.mci {
      width: 32%;
      background: #1463ff;
      box-shadow: 0 0 8px rgba(20, 99, 255, 0.6);
    }

    .mini-history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 18px;
    }
    .sparkline-svg {
      width: 100%;
      height: 18px;
      overflow: visible;
    }

    /* Footer Metadata */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      font-weight: 500;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 6px;
      margin-top: 1px;
    }
    .footer-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .footer-highlight {
      color: #e2e8f0;
      font-weight: 700;
    }
    .footer-right {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
    }
    .time-icon {
      width: 10px;
      height: 10px;
      opacity: 0.7;
    }
  :host{display:block;width:100%;font-family:Inter,sans-serif;color:#fff}.card-slide{width:100%;height:241px;box-shadow:none}.headline{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.team-name{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.footer-left{gap:4px}.card-footer{font-size:9px}.competition-title{max-width:125px;overflow:hidden;white-space:nowrap}</style>

  <div class="card-slide">
    <!-- Stadium photographic background -->
    <img src="/sports-background-v1.jpg" alt="Football Stadium" class="bg-image">
    <div class="bg-overlay"></div>

    <div class="card-content">
      <!-- Top: small SPORTS badge and competition name -->
      <div class="top-bar">
        <div class="badge-group">
          <div class="sports-pill">
            <span class="sports-dot"></span>
            Sports
          </div>
          <span class="competition-title" data-field="competition">FOOTBALL</span>
        </div>
        <span class="round-tag">MARKET</span>
      </div>

      <!-- Center: two opposing teams, team crests, and bold VS -->
      <div class="matchup-row">
        <!-- Team 1 -->
        <div class="team-cell">
          <div class="team-crest crest-ars">
            <!-- Custom stylized cannon crest SVG -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12l-7-7-7 7"/>
              <path d="M12 19V5"/>
              <circle cx="12" cy="19" r="2" fill="#ef4444"/>
            </svg>
          </div>
          <div class="team-info">
            <span class="team-name" data-field="team-name">—</span>
            <span class="team-prob prob-ars" data-field="yes">—</span>
          </div>
        </div>

        <!-- VS Divider -->
        <div class="vs-divider">
          <span class="vs-label">VS</span>
          <span class="draw-prob">YES / NO</span>
        </div>

        <!-- Team 2 -->
        <div class="team-cell right">
          <div class="team-info">
            <span class="team-name">NO</span>
            <span class="team-prob prob-mci" data-field="no">—</span>
          </div>
          <div class="team-crest crest-mci">
            <!-- Custom stylized ship crest SVG -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 17l3-7 5 3 4-6 8 10H2z"/>
              <path d="M7 21h10"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Below: real market question (max two lines) -->
      <div class="headline-wrap">
        <h2 data-field="title" class="headline">Will Arsenal defeat Manchester City in the title decider?</h2>
      </div>

      <!-- Bottom: compact probability-history chart, win probabilities, volume & closing time -->
      <div class="chart-section">
        <!-- Live multi-way probability ratio bar -->
        <div class="probability-segmented-bar">
          <div class="bar-seg ars" data-field="yes-bar"></div>
          
          <div class="bar-seg mci" data-field="no-bar"></div>
        </div>

        <!-- Continuous probability trajectory sparkline -->
        <div class="mini-history-row">
          <svg class="sparkline-svg" viewBox="0 0 358 18" preserveAspectRatio="none">
            <defs>
              <linearGradient id="sportsGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#1463ff" stop-opacity="0.8"/>
                <stop offset="60%" stop-color="#0bba74" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#0bba74" stop-opacity="1"/>
              </linearGradient>
            </defs>
            <path data-field="chart-line" d="M0 12 Q 40 15, 80 10 T 160 11 T 240 6 T 320 8 L 358 3" 
                  fill="none" 
                  stroke="url(#sportsGrad)" 
                  stroke-width="1.8" 
                  stroke-linecap="round"/>
            <path data-field="chart-area" fill="none" d=""/><circle data-field="chart-dot" cx="358" cy="3" r="2.5" fill="#0bba74" filter="drop-shadow(0 0 4px #0bba74)"/>
          </svg>
        </div>

        <!-- Footer Metadata -->
        <div class="card-footer">
          <div class="footer-left">
            <span>Vol: <strong data-field="volume" class="footer-highlight">—</strong></span>
            <span style="opacity: 0.35">•</span>
            <span><span data-field="history-label">LOADING HISTORY</span></span>
          </div>
          <div class="footer-right">
            <svg class="time-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>Closes <span data-field="end">—</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
